<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comms Hub | Spectrum '26</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyATPWBVx5bqqIrbgaXm44KDAy29b4ru6NY",
            authDomain: "spectram-234f7.firebaseapp.com",
            projectId: "spectram-234f7",
            storageBucket: "spectram-234f7.firebasestorage.app",
            messagingSenderId: "192476382126",
            appId: "1:192476382126:web:26422db3e948165933be3f",
            measurementId: "G-SK3RN0FDZK",
            databaseURL: "https://spectram-234f7-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let allUsers = [];
        let currentTab = 'pending'; // 'pending' or 'sent'

        // --- AUTH & LOAD ---
        window.onload = function() {
            lucide.createIcons();
            
            auth.onAuthStateChanged(user => {
                if (user) {
                    checkAdmin(user.email);
                } else {
                    document.getElementById('login-modal').classList.remove('hidden');
                }
            });
        };

        function checkAdmin(email) {
            const safeEmail = email.replace(/\./g, ',');
            db.ref('staff_access/' + safeEmail).once('value').then(snap => {
                if (snap.exists()) {
                    document.getElementById('login-modal').classList.add('hidden');
                    loadUsers();
                } else {
                    alert("Access Denied");
                    auth.signOut();
                }
            });
        }

        function loadUsers() {
            document.getElementById('loader').classList.remove('hidden');
            db.ref('users').on('value', snap => {
                const data = snap.val();
                allUsers = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        allUsers.push({ ...data[key], key: key });
                    });
                }
                filterAndRender();
                document.getElementById('loader').classList.add('hidden');
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-pending').className = tab === 'pending' ? 'px-4 py-2 text-sm font-bold text-white border-b-2 border-blue-500' : 'px-4 py-2 text-sm text-gray-500 hover:text-white';
            document.getElementById('tab-sent').className = tab === 'sent' ? 'px-4 py-2 text-sm font-bold text-white border-b-2 border-green-500' : 'px-4 py-2 text-sm text-gray-500 hover:text-white';
            filterAndRender();
        }

        function filterAndRender() {
            const query = document.getElementById('search-box').value.toLowerCase();
            
            const filtered = allUsers.filter(u => {
                // Search Filter
                const matchesSearch = (u.name && u.name.toLowerCase().includes(query)) || 
                                      (u.spectrumId && u.spectrumId.toLowerCase().includes(query)) ||
                                      (u.collegeName && u.collegeName.toLowerCase().includes(query));
                
                // Tab Filter
                const isSent = u.comms?.wa === true; // Consider moved if WhatsApp is sent
                const matchesTab = currentTab === 'pending' ? !isSent : isSent;

                return matchesSearch && matchesTab;
            });

            renderTable(filtered);
        }

        function renderTable(users) {
            const tbody = document.getElementById('user-table');
            tbody.innerHTML = '';
            
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-gray-500">No users in this list.</td></tr>';
                return;
            }

            // Sort: Pending Payments First, then by date
            users.sort((a, b) => {
                if (a.paymentStatus === 'Pending' && b.paymentStatus !== 'Pending') return -1;
                if (a.paymentStatus !== 'Pending' && b.paymentStatus === 'Pending') return 1;
                
                const dateA = a.order ? new Date(a.order.timestamp) : new Date(0);
                const dateB = b.order ? new Date(b.order.timestamp) : new Date(0);
                return dateB - dateA;
            });

            users.forEach(u => {
                // Determine Reg Time
                let regTime = "Not Registered";
                if (u.order && u.order.timestamp) {
                    const date = new Date(u.order.timestamp);
                    regTime = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                }

                // Sanitize Phone
                let phone = u.phone ? u.phone.replace(/\D/g, '') : '';
                if(phone.length === 10) phone = '91' + phone;

                // Extract Details
                const passName = u.order?.pass || 'No Pass';
                let eventList = "None";
                if (u.order && u.order.events && Array.isArray(u.order.events)) {
                    eventList = u.order.events.map(e => e.title).join(', ');
                } else if (u.order && u.order.events) {
                     eventList = Object.values(u.order.events).map(e => e.title).join(', ');
                }

                // Payment Status Highlighting
                let rowClass = "border-b border-gray-800 hover:bg-white/5 transition-colors";
                let payStatusBadge = "";
                
                if (u.paymentStatus === 'Pending') {
                    rowClass = "border-b border-yellow-600/30 bg-yellow-900/10 hover:bg-yellow-900/20 transition-colors";
                    payStatusBadge = `<span class="inline-block mt-1 px-2 py-0.5 rounded text-[10px] font-bold bg-yellow-600/20 text-yellow-500 border border-yellow-600/30 flex items-center w-fit gap-1"><i data-lucide="alert-circle" class="w-3"></i> Payment Pending</span>`;
                }

                // Message Content (Fixed Encoding with .replace for HTML Attributes)
                const waText = encodeURIComponent(`Hello ${u.name},

Regarding your registration for Spectrum '26.

*Details:*
🆔 ID: ${u.spectrumId}
🎟️ Pass: ${passName}
📍 Events: ${eventList}
${u.paymentStatus === 'Pending' ? '\n⚠️ *Action Required:* Your payment verification is pending. Please verify your transaction ID.' : ''}

Please confirm your participation.

- Yasar CH, Tech Head`).replace(/'/g, "%27");

                const waLink = phone ? `https://wa.me/${phone}?text=${waText}` : '#';
                
                const mailSubject = encodeURIComponent(`Spectrum '26 Registration - ${u.spectrumId}`).replace(/'/g, "%27");
                const mailBody = encodeURIComponent(`Dear ${u.name},

We are writing regarding your registration at Spectrum '26.

Participant ID: ${u.spectrumId}
College: ${u.collegeName}

Registration Details:
- Pass Type: ${passName}
- Registered Events: ${eventList}
- Date: ${regTime}
${u.paymentStatus === 'Pending' ? '\nNOTE: Your payment verification is currently PENDING. Please check your dashboard.' : ''}

Please let us know if you have any questions.

Regards,
Yasar CH
Tech Head, Spectrum '26`).replace(/'/g, "%27");

                const waStatus = u.comms?.wa ? 'text-green-500' : 'text-gray-600';
                const mailStatus = u.comms?.email ? 'text-blue-500' : 'text-gray-600';

                tbody.innerHTML += `
                <tr class="${rowClass}">
                    <td class="p-4">
                        <div class="font-bold text-white">${u.name}</div>
                        <div class="text-xs text-blue-400 font-mono">${u.spectrumId || 'NO ID'}</div>
                    </td>
                    <td class="p-4 text-sm text-gray-300 max-w-[200px] truncate" title="${u.collegeName}">${u.collegeName || 'N/A'}</td>
                    <td class="p-4">
                        <div class="text-xs text-gray-400">${regTime}</div>
                        <div class="text-[10px] text-gray-600 font-mono uppercase">${passName}</div>
                        ${payStatusBadge}
                    </td>
                    <td class="p-4">
                        <div class="flex gap-2 text-xs font-mono mb-2">
                           <span class="${waStatus} flex items-center gap-1"><i data-lucide="check" class="w-3"></i> WA</span>
                           <span class="${mailStatus} flex items-center gap-1"><i data-lucide="check" class="w-3"></i> Mail</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="sendWA('${u.key}', '${phone}', '${waText}')" class="${!phone ? 'opacity-50 cursor-not-allowed' : ''} bg-green-600/20 text-green-400 hover:bg-green-600/40 border border-green-600/30 px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1 transition-all">
                                <i data-lucide="message-circle" class="w-3 h-3"></i> WhatsApp
                            </button>
                            <button onclick="sendMail('${u.key}', '${u.email}', '${mailSubject}', '${mailBody}')" class="bg-blue-600/20 text-blue-400 hover:bg-blue-600/40 border border-blue-600/30 px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1 transition-all">
                                <i data-lucide="mail" class="w-3 h-3"></i> Email
                            </button>
                        </div>
                    </td>
                </tr>`;
            });
            lucide.createIcons();
        }

        // --- ACTIONS ---
        function sendWA(key, phone, text) {
            if(!phone) return alert("No Phone Number");
            db.ref(`users/${key}/comms/wa`).set(true);
            window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
        }

        function sendMail(key, email, subject, body) {
            if(!email) return alert("No Email");
            db.ref(`users/${key}/comms/email`).set(true);
            window.open(`mailto:${email}?subject=${subject}&body=${body}`, '_blank');
        }

        function adminLogin() {
            const e = document.getElementById('adm-email').value;
            const p = document.getElementById('adm-pass').value;
            auth.signInWithEmailAndPassword(e, p).catch(e => alert(e.message));
        }
    </script>
    <style>
        body { background-color: #050505; color: white; font-family: 'Manrope', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- LOGIN MODAL -->
    <div id="login-modal" class="fixed inset-0 bg-black z-50 flex items-center justify-center">
        <div class="w-full max-w-sm p-8 bg-[#0a0a0a] border border-gray-800 rounded-xl text-center">
            <h1 class="text-2xl font-bold mb-6">COMMS HUB</h1>
            <input type="email" id="adm-email" placeholder="Admin Email" class="w-full bg-gray-900 border border-gray-700 p-3 rounded mb-3 text-sm outline-none focus:border-blue-500">
            <input type="password" id="adm-pass" placeholder="Password" class="w-full bg-gray-900 border border-gray-700 p-3 rounded mb-6 text-sm outline-none focus:border-blue-500">
            <button onclick="adminLogin()" class="w-full bg-blue-600 text-white font-bold py-3 rounded text-sm hover:bg-blue-500">ACCESS</button>
        </div>
    </div>

    <!-- HEADER -->
    <header class="border-b border-gray-800 bg-[#0a0a0a] px-6 py-4 flex justify-between items-center z-10">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-blue-600/20 rounded flex items-center justify-center text-blue-400">
                <i data-lucide="radio" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Communication Hub</h1>
                <p class="text-xs text-gray-500 font-mono">Spectrum '26 Outreach</p>
            </div>
        </div>
        
        <!-- Tabs -->
        <div class="flex bg-gray-900 rounded p-1">
            <button id="tab-pending" onclick="switchTab('pending')" class="px-4 py-2 text-sm font-bold text-white border-b-2 border-blue-500 transition-colors">Pending</button>
            <button id="tab-sent" onclick="switchTab('sent')" class="px-4 py-2 text-sm text-gray-500 hover:text-white transition-colors">Contacted</button>
        </div>

        <div class="relative">
            <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-500"></i>
            <input type="text" id="search-box" onkeyup="filterAndRender()" placeholder="Search Name, ID..." class="bg-gray-900 border border-gray-700 pl-10 pr-4 py-2 rounded text-sm text-white w-64 outline-none focus:border-blue-500 transition-colors">
        </div>
    </header>

    <!-- CONTENT -->
    <main class="flex-1 overflow-y-auto relative">
        <div id="loader" class="absolute inset-0 flex items-center justify-center bg-[#050505] z-20">
            <div class="animate-spin w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full"></div>
        </div>
        
        <table class="w-full text-left border-collapse">
            <thead class="bg-[#0f0f0f] sticky top-0 z-10 text-xs uppercase text-gray-500 font-mono tracking-wider">
                <tr>
                    <th class="p-4 border-b border-gray-800 w-1/4">Participant</th>
                    <th class="p-4 border-b border-gray-800 w-1/3">Institute</th>
                    <th class="p-4 border-b border-gray-800">Registration Data</th>
                    <th class="p-4 border-b border-gray-800">Action</th>
                </tr>
            </thead>
            <tbody id="user-table" class="bg-[#050505]">
                <!-- Rows injected by JS -->
            </tbody>
        </table>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-gray-800 p-3 text-center text-[10px] text-gray-600 bg-[#0a0a0a]">
        SECURE ADMIN TERMINAL • YASAR CH • DO NOT SHARE DATA
    </footer>

</body>
</html>
