<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENT EDITOR | SPECTRUM '26</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyATPWBVx5bqqIrbgaXm44KDAy29b4ru6NY",
            authDomain: "spectram-234f7.firebaseapp.com",
            projectId: "spectram-234f7",
            storageBucket: "spectram-234f7.firebasestorage.app",
            messagingSenderId: "192476382126",
            appId: "1:192476382126:web:26422db3e948165933be3f",
            measurementId: "G-SK3RN0FDZK",
            databaseURL: "https://spectram-234f7-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
    </script>

    <style>
        body { background-color: #000000; color: #e2e8f0; font-family: 'Manrope', sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .font-mono { font-family: 'Space Mono', monospace; }
        .scan-region { border: 2px dashed #4b5563; border-radius: 12px; overflow: hidden; position: relative; }
        .scan-region video { object-fit: cover; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- LOGIN OVERLAY -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-black flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 p-8 rounded-2xl shadow-2xl">
            <div class="text-center mb-8">
                <i data-lucide="edit" class="w-12 h-12 text-blue-500 mx-auto mb-4"></i>
                <h1 class="text-2xl font-bold text-white">EVENT EDITOR</h1>
                <p class="text-slate-500 text-xs uppercase tracking-widest mt-1">Authorized Staff Only</p>
            </div>
            <div class="space-y-4">
                <input id="login-user" type="email" placeholder="staff@nift.ac.in" class="w-full bg-black border border-zinc-700 p-4 rounded-lg text-white outline-none focus:border-blue-500 transition-all">
                <input id="login-pass" type="password" placeholder="Password" class="w-full bg-black border border-zinc-700 p-4 rounded-lg text-white outline-none focus:border-blue-500 transition-all">
                <button onclick="handleLogin()" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-lg transition-all">ACCESS TOOL</button>
            </div>
            <p id="login-msg" class="text-red-500 text-xs text-center mt-4 h-4"></p>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="app-screen" class="hidden flex-col h-full max-w-lg mx-auto w-full bg-zinc-950 shadow-2xl border-x border-zinc-800">
        
        <!-- Header -->
        <header class="p-4 bg-zinc-900 border-b border-zinc-800 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div>
                <span class="font-bold text-white tracking-wide">EVENT EDITOR</span>
            </div>
            <button onclick="doLogout()" class="text-xs text-red-500 font-bold border border-red-900 px-3 py-1 rounded hover:bg-red-900 hover:text-white transition-colors">LOGOUT</button>
        </header>

        <!-- Scanner Section -->
        <div class="p-4 flex-shrink-0 border-b border-zinc-800">
            <div id="reader" class="scan-region w-full h-48 bg-black mb-4 flex items-center justify-center">
                <div id="cam-placeholder" class="text-slate-600 text-sm animate-pulse">Camera Off</div>
            </div>
            
            <div class="flex gap-2">
                <input id="manual-input" type="text" placeholder="ID (e.g. SPEC101)" class="flex-1 bg-zinc-900 border border-zinc-700 p-3 rounded-lg text-white text-center font-mono uppercase text-lg outline-none focus:border-blue-500">
                <button onclick="fetchUser(document.getElementById('manual-input').value)" class="bg-blue-600 text-white px-6 rounded-lg font-bold"><i data-lucide="search"></i></button>
                <button onclick="toggleScanner()" class="bg-zinc-800 text-white px-4 rounded-lg"><i data-lucide="camera"></i></button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="result-area" class="flex-1 overflow-y-auto p-4 bg-black">
            <div class="h-full flex flex-col items-center justify-center text-slate-600">
                <i data-lucide="user-cog" class="w-16 h-16 mb-4 opacity-50"></i>
                <p>Scan or Search User</p>
                <p class="text-xs mt-2">Manage user event registrations here</p>
            </div>
        </div>
    </div>

    <script>
        // --- DATA ---
        const eventsData = [
            // --- CORE FLAGSHIP EVENTS (ENTRY/SHOWS) ----
            { id: 101, club: 'entertainment', title: 'EDM Night (Neon Pulse)' }, 
            { id: 102, club: 'entertainment', title: 'Fashion Show (Designer Team)' },
            { id: 103, club: 'entertainment', title: 'Fashion Show (Audience)' },
            
            // --- ADVENTURE ---
            { id: 1, club: 'adventure', title: 'Photography' },
            { id: 2, club: 'adventure', title: 'Short Film' },
            { id: 3, club: 'adventure', title: 'Match the Picture' },
            { id: 9, club: 'adventure', title: 'Mini Adventure' },

            // --- CULTURAL ---
            { id: 5, club: 'culture', title: 'Solo Dance' },
            { id: 306, club: 'culture', title: 'Group Dance' },
            { id: 6, club: 'culture', title: 'Solo Singing' },
            { id: 8, club: 'culture', title: 'Battle of Bands' },
            { id: 307, club: 'culture', title: 'Mr & Miss Spectrum' },

            // --- ENVIRONMENTAL ---
            { id: 301, club: 'environment', title: 'Graffiti Competition' },
            { id: 302, club: 'environment', title: 'Treasure Hunt (Env)' },
            { id: 303, club: 'environment', title: 'Eco Trivia' },
            { id: 304, club: 'environment', title: 'Musical Chairs' },
            { id: 305, club: 'environment', title: 'Trumbling' },

            // --- LITERARY ---
            { id: 401, club: 'lit', title: "Devil's Advocate" },
            { id: 402, club: 'lit', title: 'Minute to Win It' },
            { id: 403, club: 'lit', title: 'Snakes & Ladders' },
            { id: 404, club: 'lit', title: 'Bollymania' },

            // --- ESSC ---
            { id: 18, club: 'essc', title: 'Nukkad Natak' },
            { id: 19, club: 'essc', title: 'Housie' },
            { id: 20, club: 'essc', title: 'Pong the Palooza' },
            { id: 321, club: 'essc', title: 'Face Painting' },
            { id: 222, club: 'essc', title: 'Poster Making' },

            // --- SPORTS ---
            { id: 201, club: 'sports', title: 'Futsal Mix' },
            { id: 202, club: 'sports', title: 'Volleyball Mix' },
            { id: 203, club: 'sports', title: 'Basketball Mix' },
            { id: 204, club: 'sports', title: 'Throwball (Girls)' },
            { id: 205, club: 'sports', title: 'Table Tennis (Boys)' },
            { id: 206, club: 'sports', title: 'Table Tennis (Girls)' },
            { id: 207, club: 'sports', title: 'Chess' },
            { id: 208, club: 'sports', title: 'Carrom' },
            { id: 209, club: 'sports', title: 'Tug of War Mix' }
        ];

        let html5QrcodeScanner = null;
        let isScanning = false;
        let currentUserKey = null;
        let currentUserData = null;

        function init() {
            lucide.createIcons();
            auth.onAuthStateChanged(user => {
                if(user) checkAccess(user.email);
            });
        }

        // --- AUTH ---
        function handleLogin() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            const msg = document.getElementById('login-msg');
            const btn = document.getElementById('btn-login');

            if(!u || !p) { msg.innerText = "Please enter credentials"; return; }

            btn.innerText = "Verifying...";
            btn.disabled = true;
            
            auth.signInWithEmailAndPassword(u, p)
                .then(cred => checkAccess(cred.user.email))
                .catch(err => {
                    msg.innerText = "Login Failed: " + err.message;
                    btn.innerText = "ACCESS TOOL";
                    btn.disabled = false;
                });
        }

        function checkAccess(email) {
            const safeEmail = email.toLowerCase().replace(/\./g, ',');
            db.ref('staff_access/' + safeEmail).once('value').then(snap => {
                const data = snap.val();
                // Allow admin and club roles to edit events
                if (data && (data.role === 'admin' || data.role === 'club')) {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app-screen').classList.remove('hidden');
                    document.getElementById('app-screen').classList.add('flex');
                } else {
                    alert("Access Denied: Admin or Club Role Required.");
                    auth.signOut();
                    document.getElementById('btn-login').innerText = "ACCESS TOOL";
                    document.getElementById('btn-login').disabled = false;
                }
            });
        }

        function doLogout() {
            auth.signOut().then(() => location.reload());
        }

        // --- SCANNER ---
        function toggleScanner() {
            if(isScanning) {
                if(html5QrcodeScanner) {
                    // Properly stop the scanner without throwing a clear() error
                    html5QrcodeScanner.stop().then(() => {
                        isScanning = false;
                        document.getElementById('cam-placeholder').innerText = "Camera Off";
                        document.getElementById('cam-placeholder').style.display = "block";
                    }).catch(e => {
                        console.warn("Camera stop error:", e);
                        isScanning = false; // Reset state anyway
                    });
                }
            } else {
                isScanning = true;
                html5QrcodeScanner = new Html5Qrcode("reader");
                html5QrcodeScanner.start(
                    { facingMode: "environment" }, 
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText) => { 
                        // Stop scanning on success
                        html5QrcodeScanner.stop().then(() => {
                            isScanning = false;
                            document.getElementById('cam-placeholder').innerText = "Camera Off";
                            document.getElementById('cam-placeholder').style.display = "block";
                            fetchUser(decodedText); 
                        });
                    },
                    (errorMessage) => { /* ignore */ }
                ).catch(err => {
                    alert("Camera Error: " + err);
                    isScanning = false;
                });
            }
        }

        // --- CORE LOGIC ---
        function fetchUser(id) {
            id = id.toUpperCase().trim();
            const container = document.getElementById('result-area');
            if(!id) return;
            
            container.innerHTML = `<div class="flex h-full items-center justify-center text-blue-500"><i data-lucide="loader-2" class="animate-spin w-10 h-10"></i></div>`;
            lucide.createIcons();

            db.ref('users').orderByChild('spectrumId').equalTo(id).once('value').then(snap => {
                if(!snap.exists()) {
                    container.innerHTML = `<div class="text-center text-red-500 p-10"><i data-lucide="x-circle" class="w-12 h-12 mx-auto mb-2"></i><h2 class="font-bold">User Not Found</h2><p class="text-xs">ID: ${id}</p></div>`;
                    lucide.createIcons();
                    return;
                }

                const key = Object.keys(snap.val())[0];
                const u = Object.values(snap.val())[0];
                currentUserKey = key;
                currentUserData = u;

                renderEditor(u);
            });
        }

        function renderEditor(user) {
            const container = document.getElementById('result-area');
            
            // Get Current Events
            let currentEventIds = [];
            let eventsHtml = '';
            
            if(user.order && user.order.events) {
                user.order.events.forEach(ev => {
                    currentEventIds.push(ev.id); // Track IDs to filter dropdown
                    
                    // FIXED: Only pass ID to onclick to prevent HTML injection errors with quotes
                    eventsHtml += `
                    <div class="flex justify-between items-center bg-zinc-900 border border-zinc-800 p-3 rounded-lg mb-2">
                        <div>
                            <span class="text-white font-bold text-sm block">${ev.title}</span>
                            <span class="text-xs text-zinc-500 font-mono">ID: ${ev.id}</span>
                        </div>
                        <button onclick="removeEvent(${ev.id})" class="text-red-500 hover:text-white bg-red-900/20 hover:bg-red-900 p-2 rounded transition-colors">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>`;
                });
            } else {
                eventsHtml = `<p class="text-zinc-500 text-sm italic text-center py-4">No events registered.</p>`;
            }

            // Generate Dropdown Options (Exclude already registered)
            let optionsHtml = '<option value="">Select Event to Add...</option>';
            eventsData.forEach(e => {
                if(!currentEventIds.includes(e.id) && !currentEventIds.includes(String(e.id))) {
                    optionsHtml += `<option value="${e.id}">${e.title}</option>`;
                }
            });

            container.innerHTML = `
                <div class="animate-in pb-10">
                    <div class="flex items-center gap-4 mb-6 pb-6 border-b border-zinc-800">
                        <div class="w-14 h-14 rounded-full bg-blue-600 flex items-center justify-center text-xl font-bold text-white">
                            ${user.name.substring(0,2).toUpperCase()}
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-white leading-none">${user.name}</h2>
                            <p class="text-blue-400 font-mono text-sm mt-1">${user.spectrumId}</p>
                            <p class="text-zinc-500 text-xs">${user.email}</p>
                        </div>
                    </div>
                    
                    <h3 class="text-slate-400 text-xs font-bold uppercase mb-3 tracking-widest">Registered Events</h3>
                    <div class="mb-6">
                        ${eventsHtml}
                    </div>

                    <div class="border-t border-zinc-800 pt-6">
                        <h3 class="text-slate-400 text-xs font-bold uppercase mb-3 tracking-widest">Add New Event</h3>
                        <div class="flex gap-2">
                            <select id="new-event-select" class="flex-1 bg-zinc-900 border border-zinc-700 text-white text-sm rounded p-3 outline-none">
                                ${optionsHtml}
                            </select>
                            <button onclick="addEvent()" class="bg-green-600 text-white px-4 rounded font-bold hover:bg-green-500">
                                <i data-lucide="plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // --- EDIT LOGIC ---
        function removeEvent(id) {
            // Safely fetch title internally to avoid quote issues in HTML
            const ev = currentUserData.order?.events?.find(e => e.id == id) || { title: `Event ID: ${id}` };
            
            if(!confirm(`Remove "${ev.title}" from this user?`)) return;

            // 1. Filter out from order.events
            let events = currentUserData.order?.events || [];
            const newEvents = events.filter(e => e.id != id);

            const updates = {};
            updates[`users/${currentUserKey}/order/events`] = newEvents;
            
            // 2. Remove other traces to be clean
            updates[`users/${currentUserKey}/attendedEvents/${id}`] = null;
            updates[`users/${currentUserKey}/qualifications/${id}`] = null;
            updates[`users/${currentUserKey}/squads/${id}`] = null;

            db.ref().update(updates).then(() => {
                alert("Event Removed");
                // Refresh data
                refreshUser();
            }).catch(e => alert("Error: " + e.message));
        }

        function addEvent() {
            const select = document.getElementById('new-event-select');
            const id = select.value;
            if(!id) return;

            const evtObj = eventsData.find(e => e.id == id);
            if(!confirm(`Add "${evtObj.title}" to this user?`)) return;

            let events = currentUserData.order?.events || [];
            // Just in case check
            if(events.some(e => e.id == id)) return alert("Already registered");

            // Add standard event object
            events.push({
                id: evtObj.id,
                title: evtObj.title,
                isPremium: false,
                type: 'Manual Add'
            });

            db.ref(`users/${currentUserKey}/order/events`).set(events).then(() => {
                alert("Event Added");
                refreshUser();
            }).catch(e => alert("Error: " + e.message));
        }

        function refreshUser() {
            db.ref(`users/${currentUserKey}`).once('value').then(snap => {
                currentUserData = snap.val();
                renderEditor(currentUserData);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
