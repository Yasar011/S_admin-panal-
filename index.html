<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTRUM ADMIN | ACCESS CONTROL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- FIREBASE SDK (Must match Login Page versions) -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyATPWBVx5bqqIrbgaXm44KDAy29b4ru6NY",
            authDomain: "spectram-234f7.firebaseapp.com",
            projectId: "spectram-234f7",
            storageBucket: "spectram-234f7.firebasestorage.app",
            messagingSenderId: "192476382126",
            appId: "1:192476382126:web:26422db3e948165933be3f",
            measurementId: "G-SK3RN0FDZK",
            databaseURL: "https://spectram-234f7-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
    </script>

    <style>
        body { background-color: #020617; color: #e2e8f0; font-family: 'Manrope', sans-serif; }
        .font-mono { font-family: 'Space Mono', monospace; }
        
        /* Glassmorphism */
        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }
    </style>
</head>
<body class="min-h-screen relative p-6">
    <div class="fixed inset-0 bg-grid pointer-events-none -z-10"></div>

    <!-- HEADER -->
    <header class="max-w-6xl mx-auto flex justify-between items-center mb-10">
        <div>
            <h1 class="text-3xl font-black text-white tracking-tighter">ADMIN CONSOLE</h1>
            <p class="text-slate-500 font-mono text-xs uppercase tracking-widest">Access Verification Node</p>
        </div>
        <div class="flex gap-4">
            <a href="index.html" class="flex items-center gap-2 text-xs font-bold text-slate-400 hover:text-white transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> BACK TO HUB
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- PENDING REQUESTS COLUMN -->
        <div class="lg:col-span-2 space-y-6">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse"></div>
                <h2 class="text-xl font-bold text-white">Pending Requests</h2>
                <span id="pending-count" class="bg-slate-800 text-slate-300 text-[10px] px-2 py-1 rounded-full">0</span>
            </div>

            <div id="pending-list" class="space-y-4">
                <!-- Pending Cards injected here -->
                <div class="text-center p-12 text-slate-600 font-mono text-xs border border-dashed border-slate-800 rounded-xl">
                    Scanning for incoming signals...
                </div>
            </div>
        </div>

        <!-- ACTIVE STAFF COLUMN -->
        <div class="space-y-6">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <h2 class="text-xl font-bold text-white">Active Staff</h2>
                <span id="active-count" class="bg-slate-800 text-slate-300 text-[10px] px-2 py-1 rounded-full">0</span>
            </div>

            <div class="glass rounded-xl overflow-hidden">
                <div class="overflow-y-auto max-h-[600px] p-4 space-y-2" id="active-list">
                    <!-- Active List Items injected here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // 1. SECURITY CHECK
        auth.onAuthStateChanged(user => {
            if (!user) {
                // Ideally redirect, but we might be in a preview where redirect loop is possible
                // if index.html isn't served on the same origin perfectly.
                // console.log("No user found");
                // window.location.href = "index.html"; 
            } else {
                console.log("Admin Logged In:", user.email);
            }
        });

        // 2. FETCH PENDING REQUESTS
        db.ref('staff_requests').on('value', snap => {
            const list = document.getElementById('pending-list');
            list.innerHTML = '';
            let count = 0;

            if (snap.exists()) {
                const data = snap.val();
                Object.keys(data).forEach(key => {
                    const req = data[key];
                    count++;
                    list.innerHTML += createPendingCard(key, req);
                });
            } else {
                list.innerHTML = `<div class="text-center p-12 text-slate-600 font-mono text-xs border border-dashed border-slate-800 rounded-xl">No pending requests found.</div>`;
            }
            document.getElementById('pending-count').innerText = count;
            lucide.createIcons();
        });

        // 3. FETCH ACTIVE STAFF
        db.ref('staff_access').on('value', snap => {
            const list = document.getElementById('active-list');
            list.innerHTML = '';
            let count = 0;

            if (snap.exists()) {
                const data = snap.val();
                Object.keys(data).forEach(key => {
                    const staff = data[key];
                    count++;
                    list.innerHTML += createActiveRow(key, staff);
                });
            }
            document.getElementById('active-count').innerText = count;
        });

        // --- TEMPLATES ---

        function createPendingCard(key, req) {
            const safeKey = key.replace(/,/g, '.'); // Display formatting
            const time = new Date(req.timestamp).toLocaleDateString();
            
            return `
            <div class="glass p-6 rounded-xl border-l-4 border-l-yellow-500 relative group animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div class="flex justify-between items-start">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs font-bold bg-slate-800 text-slate-300 px-2 py-0.5 rounded uppercase">${req.role}</span>
                            ${req.club_code !== 'all' ? `<span class="text-xs font-bold bg-blue-900/30 text-blue-400 px-2 py-0.5 rounded uppercase">${req.club_code}</span>` : ''}
                        </div>
                        <h3 class="text-lg font-bold text-white">${req.name}</h3>
                        <p class="text-sm text-slate-400 font-mono">${req.email}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-slate-600 font-mono">${time}</p>
                    </div>
                </div>
                
                <div class="mt-6 flex gap-3 border-t border-slate-700/50 pt-4">
                    <button onclick="approveUser('${key}')" class="flex-1 bg-green-600 hover:bg-green-500 text-white py-2 rounded-lg text-xs font-bold flex justify-center items-center gap-2 transition-all">
                        <i data-lucide="check-circle" class="w-4 h-4"></i> APPROVE
                    </button>
                    <button onclick="rejectUser('${key}')" class="px-4 border border-red-900/50 text-red-500 hover:bg-red-900/20 hover:text-red-400 rounded-lg text-xs font-bold transition-all">
                        REJECT
                    </button>
                </div>
            </div>`;
        }

        function createActiveRow(key, staff) {
            return `
            <div class="p-3 rounded-lg hover:bg-slate-800/50 transition-colors border border-transparent hover:border-slate-700">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs font-bold text-white">${staff.name}</span>
                    <span class="text-[10px] bg-slate-800 px-1.5 rounded text-slate-400 uppercase">${staff.role}</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-[10px] text-slate-500 font-mono truncate max-w-[150px]">${staff.email}</span>
                    <button onclick="revokeAccess('${key}')" class="text-[10px] text-red-500 hover:text-red-400 hover:underline">Revoke</button>
                </div>
            </div>`;
        }

        // --- ACTIONS ---

        // MOVE from staff_requests -> staff_access
        window.approveUser = function(key) {
            // FIX: Ensure user is logged in before accessing email properties
            const currentUser = auth.currentUser;
            if (!currentUser) {
                alert("Session expired or user not logged in. Please refresh or login again.");
                return;
            }

            db.ref('staff_requests/' + key).once('value').then(snap => {
                if (snap.exists()) {
                    const data = snap.val();
                    data.status = 'approved';
                    data.approvedBy = currentUser.email;
                    data.approvedAt = Date.now();

                    // 1. Add to Access List
                    db.ref('staff_access/' + key).set(data).then(() => {
                        // 2. Remove from Request List
                        db.ref('staff_requests/' + key).remove();
                        // Optional: Notify
                        console.log("Approved", data.email);
                    });
                }
            });
        }

        // DELETE from staff_requests
        window.rejectUser = function(key) {
            if(confirm('Are you sure you want to reject this request?')) {
                db.ref('staff_requests/' + key).remove();
            }
        }

        // DELETE from staff_access
        window.revokeAccess = function(key) {
            if(confirm('Revoke access for this user? They will not be able to login.')) {
                db.ref('staff_access/' + key).remove();
            }
        }

    </script>
</body>
</html>
