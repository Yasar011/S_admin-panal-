<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Portal | Spectrum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Oswald:wght@500&display=swap" rel="stylesheet">
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyATPWBVx5bqqIrbgaXm44KDAy29b4ru6NY",
            authDomain: "spectram-234f7.firebaseapp.com",
            projectId: "spectram-234f7",
            storageBucket: "spectram-234f7.firebasestorage.app",
            messagingSenderId: "192476382126",
            appId: "1:192476382126:web:26422db3e948165933be3f",
            measurementId: "G-SK3RN0FDZK",
            databaseURL: "https://spectram-234f7-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Get Team ID from URL
        let teamId = new URLSearchParams(window.location.search).get('tid');

        function init() {
            lucide.createIcons();
            
            if(!teamId) {
                document.body.innerHTML = '<div class="h-screen flex items-center justify-center text-white bg-black">Invalid Link. No Team ID found.</div>';
                return;
            }

            // Check if user is already logged in (optional session storage check)
            if(sessionStorage.getItem('team_logged_in') === teamId) {
                loadDashboard();
            }
        }

        function checkLogin() {
            const enteredCode = document.getElementById('access-code').value;
            if(!enteredCode) return alert("Enter Code");

            const btn = document.getElementById('login-btn');
            btn.innerText = "Verifying...";

            db.ref(`users/${teamId}`).once('value').then(snap => {
                const u = snap.val();
                if(u && u.fashion_pass && u.fashion_pass === enteredCode) {
                    sessionStorage.setItem('team_logged_in', teamId);
                    loadDashboard(u);
                } else {
                    alert("Invalid Access Code. Please check with Admin.");
                    btn.innerText = "Login";
                }
            });
        }

        function loadDashboard(userData = null) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');

            if(userData) {
                renderTeamInfo(userData);
            } else {
                db.ref(`users/${teamId}`).once('value').then(snap => renderTeamInfo(snap.val()));
            }

            // Listen for Volunteers
            db.ref('fashion_volunteers').orderByChild('teamId').equalTo(teamId).on('value', snap => {
                const list = document.getElementById('vol-list');
                list.innerHTML = '';
                if(snap.val()) {
                    Object.entries(snap.val()).forEach(([key, v]) => {
                        list.innerHTML += `
                        <div class="bg-white/5 border border-white/10 p-3 rounded flex justify-between items-center mb-2">
                            <div>
                                <p class="text-white font-bold text-sm">${v.name}</p>
                                <p class="text-xs text-gray-500 font-mono">${v.specId}</p>
                                <p class="text-[10px] text-purple-400 uppercase mt-1">${v.role}</p>
                            </div>
                            <button onclick="removeVol('${key}')" class="text-red-500 hover:text-white p-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>`;
                    });
                } else {
                    list.innerHTML = '<div class="text-gray-500 text-sm text-center py-4 italic">No volunteers added yet.</div>';
                }
                lucide.createIcons();
            });
        }

        function renderTeamInfo(u) {
            if(!u) return;
            document.getElementById('team-name').innerText = u.name;
            document.getElementById('team-id').innerText = u.spectrumId;
        }

        function addVol() {
            const specId = document.getElementById('vol-id').value.toUpperCase().trim();
            const role = document.getElementById('vol-role').value.trim();
            const btn = document.getElementById('add-btn');

            if(!specId || !role) return alert("Please fill all fields");

            btn.innerText = "Searching...";
            btn.disabled = true;
            
            // Search for user by Spectrum ID
            db.ref('users').once('value').then(snap => {
                const users = snap.val();
                let foundUser = null;
                for(let k in users) {
                    if(users[k].spectrumId === specId) {
                        foundUser = users[k];
                        break;
                    }
                }

                if(foundUser) {
                    db.ref('fashion_volunteers').push({
                        name: foundUser.name,
                        specId: specId,
                        role: role,
                        teamId: teamId,
                        timestamp: Date.now()
                    }).then(() => {
                        alert("Volunteer Added Successfully!");
                        document.getElementById('vol-id').value = '';
                        document.getElementById('vol-role').value = '';
                        btn.innerText = "Add Volunteer";
                        btn.disabled = false;
                    });
                } else {
                    alert("Invalid Spectrum ID. User not registered in system.");
                    btn.innerText = "Add Volunteer";
                    btn.disabled = false;
                }
            });
        }

        function removeVol(key) {
            if(confirm("Remove this volunteer from your team?")) {
                db.ref('fashion_volunteers/' + key).remove();
            }
        }
    </script>
</head>
<body onload="init()" class="bg-[#050505] min-h-screen flex items-center justify-center p-4 font-sans text-white bg-[url('https://grainy-gradients.vercel.app/noise.svg')]">

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="w-full max-w-sm bg-[#0a0a0a] border border-purple-500/30 rounded-xl p-8 shadow-[0_0_40px_rgba(168,85,247,0.1)] text-center">
        <h1 class="font-bold text-3xl mb-2 tracking-wide">TEAM PORTAL</h1>
        <p class="text-gray-400 text-xs uppercase tracking-[0.2em] mb-8">Secure Access</p>
        
        <div class="space-y-4">
            <input type="password" id="access-code" placeholder="ENTER 4-DIGIT CODE" class="w-full bg-white/5 border border-white/20 p-4 rounded text-center text-xl tracking-[0.5em] font-mono text-white outline-none focus:border-purple-500 focus:bg-black transition-colors placeholder:text-gray-600">
            <button onclick="checkLogin()" id="login-btn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded text-xs uppercase tracking-widest transition-all shadow-lg shadow-purple-900/20">Access Dashboard</button>
        </div>
        <p class="text-[10px] text-gray-600 mt-6">Contact Admin if you lost your code.</p>
    </div>

    <!-- 2. DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="hidden w-full max-w-md bg-[#0a0a0a] border border-purple-500/30 rounded-xl p-6 shadow-2xl relative overflow-hidden">
        <!-- Top accent line -->
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-600 to-blue-600"></div>
        
        <div class="text-center mb-8 pt-2">
            <h1 class="font-bold text-2xl mb-1">TEAM DASHBOARD</h1>
            <p class="text-gray-400 text-[10px] uppercase tracking-widest">Manage Your Volunteers</p>
        </div>

        <!-- Team Header -->
        <div class="bg-white/5 p-4 rounded-lg mb-6 text-center border border-white/10">
            <p class="text-[10px] text-gray-500 uppercase tracking-wider mb-1">Logged in as</p>
            <h2 id="team-name" class="font-bold text-xl text-white">Loading...</h2>
            <p id="team-id" class="text-purple-400 font-mono text-xs tracking-wide">...</p>
        </div>

        <!-- Add Form -->
        <div class="space-y-3 mb-8 pb-8 border-b border-white/10">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 flex items-center gap-2"><i data-lucide="user-plus" class="w-3 h-3"></i> Add Crew Member</h3>
            <input id="vol-id" type="text" placeholder="Spectrum ID (e.g. SPEC123)" class="w-full bg-black border border-white/20 p-3 rounded text-sm text-white outline-none focus:border-purple-500 uppercase font-mono placeholder:normal-case">
            <input id="vol-role" type="text" placeholder="Role (e.g. Makeup, Helper, Logistics)" class="w-full bg-black border border-white/20 p-3 rounded text-sm text-white outline-none focus:border-purple-500">
            <button onclick="addVol()" id="add-btn" class="w-full bg-white text-black font-bold py-3 rounded text-xs uppercase tracking-widest hover:bg-gray-200 transition-colors">Add Volunteer</button>
        </div>

        <!-- List -->
        <div>
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3 flex items-center gap-2"><i data-lucide="users" class="w-3 h-3"></i> Current Volunteers</h3>
            <div id="vol-list" class="space-y-2 max-h-64 overflow-y-auto pr-1 scrollbar-hide">
                <!-- Content injected here -->
            </div>
        </div>

        <p class="text-center text-[10px] text-gray-700 mt-6 font-mono">Spectrum '26 System</p>
    </div>

</body>
</html>
